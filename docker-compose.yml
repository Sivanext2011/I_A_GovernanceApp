version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - app-uploads:/app/uploads
      - app-exports:/app/exports
      - app-photos:/app/photos
      - app-logs:/app/logs
      - ./docs:/app/docs
    environment:
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  app-uploads:
  app-exports:
  app-photos:
  app-logs:
